<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;font-weight:600;src:url(fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:400;src:url(fonts/node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:500;src:url(fonts/node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:700;src:url(fonts/node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#fbf8f4;color:#1d1a26;font-family:"DM Sans",sans-serif;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:#e4572e}
.left{position:absolute;left:72px;top:50px;width:520px;height:530px;display:flex;flex-direction:column}
.logo{width:150px;height:150px;object-fit:contain;margin:-14px 0 6px -12px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:56px;line-height:1.06;letter-spacing:-.5px}
h1 em{font-style:normal;color:#e4572e}
p{font-size:23px;line-height:1.4;color:#5d5868;margin-top:20px}
.chips{display:flex;gap:10px;margin-top:auto}
.chip{font-weight:700;font-size:18px;padding:10px 18px;border-radius:99px;border:2px solid #1d1a26}
.chip.hot{background:#1d1a26;color:#fbf8f4}
.grid{position:absolute;right:48px;top:48px;width:534px;height:534px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.grid div{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 1px 2px #1d1a260d,0 10px 26px #1d1a2614}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
<body>
<div class="bar"></div>
<div class="left">
  <img class="logo" src="src-orig/uploads/logo.webp" alt="">
  <h1>Gifts delivered<br>in <em>2–4 hours</em><br>across Delhi.</h1>
  <p>Bottles, diary &amp; pen sets, bags, keychains and Diwali hampers, with a name or your logo.</p>
  <div class="chips"><span class="chip hot">Same-day delivery</span><span class="chip">Bulk &amp; corporate orders</span></div>
</div>
<div class="grid">
  <div><img src="src-orig/uploads/catalogue/bot-001.webp" alt=""></div>
  <div><img src="src-orig/uploads/catalogue/dg-13.webp" alt=""></div>
  <div><img src="src-orig/uploads/catalogue/key-15.webp" alt=""></div>
  <div><img src="diwali-crop.png" alt=""></div>
</div>
</body></html>
